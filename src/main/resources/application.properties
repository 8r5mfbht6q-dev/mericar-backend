spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mericar_1}
spring.datasource.username=${DB_USERNAME:alejandro}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
